
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>King Kyle's Royal Bone Tester</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#24164d;color:white;font-family:Arial;text-align:center}
h2{margin:15px 8px 5px}
#stage{height:53vh;touch-action:none}
.panel{margin:10px;padding:15px;background:#40306e;border-radius:16px}
select,input{width:100%;margin:12px 0}
select{padding:12px;font-size:16px;border-radius:10px}
input{accent-color:#d8ff75}
button{padding:12px 20px;border:0;border-radius:20px;background:#d8ff75;font-weight:bold}
#status,#details{font-size:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>👑 Royal Bone Tester 🦊</h2>
<p>Find out what Kyle's mystery bones move!</p>
<div id="stage"></div>
<div class="panel">
<p id="status">Preparing King Kyle...</p>
<label for="bone">🦴 Choose a bone</label>
<select id="bone" disabled>
<option>Loading bones...</option>
</select>
<p>Rotate selected bone: <span id="angle">0°</span></p>
<input id="rotation" type="range" min="-25" max="25" value="0" disabled>
<button id="reset">Reset bone</button>
<p id="details">Waiting for model...</p>
</div>
<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
}
}
</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const stage=document.getElementById('stage');
const status=document.getElementById('status');
const boneSelect=document.getElementById('bone');
const slider=document.getElementById('rotation');
const angle=document.getElementById('angle');
const details=document.getElementById('details');

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,stage.clientWidth/stage.clientHeight,.1,10000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x7777aa,3));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(5,10,8);
scene.add(light);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

let bones=[];
let selected=null;
let originalRotation=null;

function restore(){
if(selected&&originalRotation){
selected.rotation.copy(originalRotation);
selected.updateMatrixWorld(true);
}
slider.value=0;
angle.textContent='0°';
}

new FBXLoader().load(
'../kyle-walking-test/kyle_walking_v2.fbx',
async model=>{
scene.add(model);
const box=new THREE.Box3().setFromObject(model);
const size=box.getSize(new THREE.Vector3());
const center=box.getCenter(new THREE.Vector3());
const height=Math.max(size.y,1);

camera.position.set(center.x,center.y+height*.25,center.z+height*2.3);
camera.lookAt(center);
controls.target.copy(center);
controls.update();

model.traverse(obj=>{
if(obj.isBone)bones.push(obj);
});

boneSelect.innerHTML='';
bones.forEach((b,i)=>{
const option=document.createElement('option');
option.value=i;
option.textContent=b.name||'Unnamed bone '+i;
boneSelect.appendChild(option);
});

boneSelect.disabled=false;
slider.disabled=false;

function selectBone(){
restore();
selected=bones[Number(boneSelect.value)];
originalRotation=selected.rotation.clone();
details.textContent='Selected: '+selected.name+
' | Parent: '+(selected.parent?.name||'None');
}

boneSelect.addEventListener('change',selectBone);
slider.addEventListener('input',()=>{
if(!selected)return;
const degrees=Number(slider.value);
selected.rotation.set(
originalRotation.x+THREE.MathUtils.degToRad(degrees),
originalRotation.y,
originalRotation.z
);
angle.textContent=degrees+'°';
});

document.getElementById('reset').onclick=restore;
selectBone();

try{
const texture=await new THREE.TextureLoader().loadAsync(
'../kyle-walking-test/Meshy_AI_Prince_Fox_biped_texture_0.png'
);
texture.colorSpace=THREE.SRGBColorSpace;
model.traverse(obj=>{
if(obj.isMesh){
const mats=Array.isArray(obj.material)?obj.material:[obj.material];
mats.forEach(mat=>{
if(mat){mat.map=texture;mat.needsUpdate=true;}
});
}
});
}catch(e){
status.textContent='Model loaded; texture unavailable.';
}

if(status.textContent==='Preparing King Kyle...'){
status.textContent='✅ Kyle ready! '+bones.length+' bones found.';
}
},
undefined,
error=>{
status.textContent='❌ Could not load model.';
details.textContent=String(error);
}
);

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=stage.clientWidth/stage.clientHeight;
camera.updateProjectionMatrix();
renderer.setSize(stage.clientWidth,stage.clientHeight);
});
</script>
</body>
</html>
