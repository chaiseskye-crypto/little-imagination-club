
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King Kyle Talking Test</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(#24164d, #6443a2);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h2 { margin: 16px 0 5px; }
#stage {
  width: 100%;
  height: 60vh;
  touch-action: none;
}
button {
  padding: 13px 20px;
  margin: 5px;
  border: 0;
  border-radius: 22px;
  background: #d8ff75;
  font-weight: bold;
}
#speech {
  margin: 8px 16px;
  padding: 14px;
  background: white;
  color: #24164d;
  border-radius: 18px;
  min-height: 54px;
}
#status { padding: 8px; font-size: 13px; }
</style>
</head>
<body>
<h2>👑 King Kyle's Talking Test 🦊</h2>
<p>Our King's first words!</p>
<div id="stage"></div>
<div id="speech" aria-live="polite">
  Tap the button to say hello!
</div>
<button id="hello">🦊 Say Hello!</button>
<button id="joke">😂 Tell a Joke!</button>
<div id="status">Preparing the Kingdom...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const status = document.getElementById('status');
const speech = document.getElementById('speech');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  45, stage.clientWidth / stage.clientHeight,
  0.1, 10000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
  0xffffff, 0x7777aa, 3
));

const light = new THREE.DirectionalLight(
  0xffffff, 3
);
light.position.set(5, 10, 8);
scene.add(light);

const controls = new OrbitControls(
  camera, renderer.domElement
);
controls.enableDamping = true;

const clock = new THREE.Clock();
let mixer = null;
let kyle = null;

new FBXLoader().load(
  '../kyle-walking-test/kyle_walking_v2.fbx',
  async model => {
    kyle = model;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const height = Math.max(size.y, 1);

    camera.position.set(
      center.x,
      center.y + height * 0.25,
      center.z + height * 2.3
    );
    camera.lookAt(center);
    controls.target.copy(center);
    controls.update();

    if (model.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      const action = mixer.clipAction(
        model.animations[0]
      );
      action.play();
      action.paused = true;
    }

    try {
      const texture = await new THREE.TextureLoader()
        .loadAsync(
          '../kyle-walking-test/' +
          'Meshy_AI_Prince_Fox_biped_texture_0.png'
        );
      texture.colorSpace = THREE.SRGBColorSpace;

      model.traverse(child => {
        if (child.isMesh) {
          const materials =
            Array.isArray(child.material)
              ? child.material : [child.material];

          materials.forEach(mat => {
            if (mat) {
              mat.map = texture;
              mat.needsUpdate = true;
            }
          });
        }
      });
    } catch (error) {
      status.textContent =
        'Kyle loaded. Check his colour texture.';
    }

    if (status.textContent ===
        'Preparing the Kingdom...') {
      status.textContent = 'Kyle is ready to talk!';
    }
  },
  undefined,
  error => {
    status.textContent =
      'Could not load Kyle. Check his model file.';
    console.error(error);
  }
);

function speak(words) {
  speech.textContent = words;

  if (!('speechSynthesis' in window)) {
    status.textContent =
      'Speech is unavailable in this browser.';
    return;
  }

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(words);
  voice.lang = 'en-AU';
  voice.rate = 1.05;
  voice.pitch = 1.25;

  window.speechSynthesis.speak(voice);
}
const kyleRoyalVoice = new Audio(
  'ElevenLabs_2026-11-01T21_50_36_King Kyle - Royal Voice V1_gen_sp100_s50_sb75_v4.mp3'
);
  const kylePeppyVoice = new Audio(
  'ElevenLabs_2026-11-01T22_42_32_King Kyle - Royal Voice V1_gen_sp100_s50_sb75_v4.mp3'
);
document.getElementById('hello').onclick = () => {
    kyleRoyalVoice.currentTime = 0;
  kyleRoyalVoice.play();
  speech.textContent = "King Kyle is speaking!";
  /*
    "G'day, little legend! Welcome to my Kingdom! " +
    "I'm King Kyle, and I've got a royal adventure " +
    "waiting just for you!"
  );
  */
};
document.getElementById('joke').onclick = () => {
  kyleRoyalVoice.pause();
  window.speechSynthesis.cancel();
  kylePeppyVoice.currentTime = 0;
  kylePeppyVoice.play();
  speech.textContent = "King Kyle has something cheeky to say!";
};
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect =
    stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(
    stage.clientWidth, stage.clientHeight
  );
});
</script>
</body>
</html>
