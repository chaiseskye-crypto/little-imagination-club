
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King Kyle Mouth Test</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(#24164d, #6443a2);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h2 { margin: 16px 0 5px; }
#stage { width: 100%; height: 60vh; touch-action: none; }
button {
  padding: 13px 20px;
  margin: 5px;
  border: 0;
  border-radius: 22px;
  background: #d8ff75;
  font-weight: bold;
}
#speech {
  margin: 8px 16px;
  padding: 14px;
  background: white;
  color: #24164d;
  border-radius: 18px;
}
#status { padding: 10px; font-size: 13px; }
</style>
</head>
<body>

<h2>👑 King Kyle's Mouth Test 🦊</h2>
<p>Let's get our King talking!</p>

<div id="stage"></div>
<div id="speech">Tap a button to hear Kyle!</div>

<button id="hello">🦊 Say Hello!</button>
<button id="joke">😂 Tell a Joke!</button>

<div id="status">Preparing the Kingdom...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const status = document.getElementById('status');
const speech = document.getElementById('speech');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  45, stage.clientWidth / stage.clientHeight,
  0.1, 10000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x7777aa, 3));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5, 10, 8);
scene.add(light);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let mouthBone = null;
let mouthRest = 0;
let currentAudio = null;
let audioContext = null;
let analyser = null;
let audioData = null;
const audioSources = new Map();

const helloAudio = new Audio(
  '../King_Kyle_Official_Voice.wav'
);

const jokeAudio = new Audio(
  '../kyle-talking-test/ElevenLabs_2026-11-01T22_42_32_King Kyle - Royal Voice V1_gen_sp100_s50_sb75_v4.mp3'
);

new FBXLoader().load(
  '../kyle-walking-test/kyle_walking_v2.fbx',
  async model => {
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const height = Math.max(size.y, 1);

    camera.position.set(
      center.x,
      center.y + height * 0.25,
      center.z + height * 2.3
    );
    camera.lookAt(center);
    controls.target.copy(center);
    controls.update();

    model.traverse(child => {
      if (child.isBone && child.name === 'Bone_046') {
        mouthBone = child;
        mouthRest = child.rotation.x;
      }
    });

    try {
      const texture = await new THREE.TextureLoader().loadAsync(
        '../kyle-walking-test/Meshy_AI_Prince_Fox_biped_texture_0.png'
      );
      texture.colorSpace = THREE.SRGBColorSpace;

      model.traverse(child => {
        if (child.isMesh) {
          const materials = Array.isArray(child.material)
            ? child.material : [child.material];

          materials.forEach(mat => {
            if (mat) {
              mat.map = texture;
              mat.needsUpdate = true;
            }
          });
        }
      });
    } catch (error) {
      console.error('Texture error:', error);
    }

    status.textContent = mouthBone
      ? 'Kyle is ready! Mouth bone found!'
      : 'Kyle loaded, but Bone_046 was not found.';
  },
  undefined,
  error => {
    status.textContent = 'Could not load Kyle.';
    console.error(error);
  }
);

async function playVoice(audio, message) {
  helloAudio.pause();
  jokeAudio.pause();

  if (!audioContext) {
    audioContext = new AudioContext();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    audioData = new Uint8Array(analyser.frequencyBinCount);
  }

  if (!audioSources.has(audio)) {
    const source = audioContext.createMediaElementSource(audio);
    source.connect(analyser);
    audioSources.set(audio, source);
  }

  analyser.connect(audioContext.destination);
  await audioContext.resume();

  audio.currentTime = 0;
  currentAudio = audio;
  speech.textContent = message;

  try {
    await audio.play();
    status.textContent = 'King Kyle is speaking!';
  } catch (error) {
    status.textContent = 'Could not play the recording.';
    console.error(error);
  }
}

document.getElementById('hello').onclick = () => {
  playVoice(helloAudio, 'King Kyle says hello!');
};

document.getElementById('joke').onclick = () => {
  playVoice(jokeAudio, 'King Kyle has something cheeky to say!');
};

function animate() {
  requestAnimationFrame(animate);

  if (mouthBone) {
    let mouthOpen = 0;

    if (
      currentAudio &&
      !currentAudio.paused &&
      !currentAudio.ended &&
      analyser
    ) {
      analyser.getByteFrequencyData(audioData);

      let total = 0;
      for (let i = 0; i < audioData.length; i++) {
        total += audioData[i];
      }

      const volume = total / audioData.length / 255;
      mouthOpen = Math.min(volume * 8, 1);
    }

    const closedAngle = THREE.MathUtils.degToRad(0);
const openAngle = THREE.MathUtils.degToRad(15);

const target = mouthRest +
  closedAngle + mouthOpen * (openAngle - closedAngle);

mouthBone.rotation.x +=
  (target - mouthBone.rotation.x) * 0.35;


  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
});
</script>
</body>
</html>
